<title>FlexBoys Agentes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN SYSTEM — FlexBoys Field App
   Mobile-first, dark, high-contrast
   ═══════════════════════════════════════════ */
:root {
  --bg:      #05080F;
  --bg1:     #090D16;
  --bg2:     #0D1220;
  --bg3:     #111828;
  --bg4:     #161F30;
  --line:    rgba(255,255,255,0.07);
  --line2:   rgba(255,255,255,0.12);
  --ink:     #EDF0F7;
  --mid:     #7A8FB0;
  --dim:     #3D4E6A;

  --red:     #E8002D;
  --red-d:   rgba(232,0,45,0.14);
  --red-b:   rgba(232,0,45,0.28);

  --ok:      #00D97E;
  --ok-d:    rgba(0,217,126,0.12);
  --warn:    #F5A623;
  --warn-d:  rgba(245,166,35,0.12);
  --blue:    #3B8BFF;
  --blue-d:  rgba(59,139,255,0.12);
  --purple:  #A78BFA;

  --font:    'Inter', system-ui, sans-serif;
  --mono:    'JetBrains Mono', monospace;

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ── HEADER ─────────────────────────────── */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg1);
  z-index: 60;
}

.app-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: var(--bg1);
  border-bottom: 1px solid var(--red);
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  height: 54px;
  gap: 12px;
  /* glow sutil embaixo */
  box-shadow: 0 2px 20px rgba(232,0,45,0.18);
}

.logo {
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--ink);
  text-transform: uppercase;
  flex-shrink: 0;
}
.logo em { color: var(--red); font-style: normal; }

.header-sep { width: 1px; height: 22px; background: var(--line2); flex-shrink: 0; }

.live-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: 1;
  min-width: 0;
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
  animation: pulse 2.5s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,217,126,0.4)} 50%{opacity:.6;box-shadow:0 0 0 4px rgba(0,217,126,0)} }
.live-text {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--mid);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.live-text span { color: var(--ok); }

.header-refresh {
  background: none;
  border: 1px solid var(--line2);
  color: var(--mid);
  padding: 5px 10px;
  border-radius: 6px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: border-color 0.15s, color 0.15s;
}
.header-refresh:active { border-color: var(--red); color: var(--ink); }
.refresh-icon { font-size: 13px; }

.countdown-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color 0.15s;
  user-select: none;
}
.countdown-pill:active { border-color: var(--red); }
.countdown-pill.paused { opacity: 0.55; }
.countdown-icon { font-size: 12px; animation: spin 2s linear infinite; }
.countdown-pill.paused .countdown-icon { animation: none; }
#refresh-countdown {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--ok);
  transition: color 0.5s;
  min-width: 36px;
  text-align: right;
}

/* ── KPI STRIP ───────────────────────────── */
.kpi-strip {
  background: var(--bg1);
  border-bottom: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.kpi-strip::-webkit-scrollbar { display: none; }

.kpi-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 6px 0;
  flex-shrink: 0;
  border-right: 1px solid var(--line);
  margin-right: 16px;
}
.kpi-chip:last-child { border-right: none; margin-right: 0; }
.kpi-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.5px;
}
.kpi-info { display: flex; flex-direction: column; }
.kpi-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--dim);
}
.kpi-sub { font-size: 10px; color: var(--mid); }

/* ── TABS ────────────────────────────────── */
.tab-nav {
  display: flex;
  background: var(--bg1);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 2px;
  flex-shrink: 0;
}
.tab-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 12px 14px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
}
.tab-btn:hover { color: var(--mid); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--red); }
.tab-icon { font-size: 13px; }
.tab-badge {
  background: var(--red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 10px;
  font-family: var(--mono);
}

/* ── SCROLL CONTENT ─────────────────────── */
.app-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.tab-pane {
  display: none;
  overflow-y: auto;
  padding: 16px max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  flex: 1;
}
.tab-pane.active { display: block; }

/* ── SEARCH BAR ─────────────────────────── */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.search-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 10px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 500;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  min-width: 0;
}
.search-input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(232,0,45,0.12);
}
.search-input::placeholder { color: var(--dim); font-size: 15px; font-family: var(--font); font-weight: 400; }

.btn-buscar {
  background: var(--red);
  border: none;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.15s;
  letter-spacing: 0.3px;
}
.btn-buscar:active { opacity: 0.8; }

.btn-clear {
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--mid);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  display: none;
}

/* ── AGENT CARD (busca) ─────────────────── */
.agent-card {
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 14px;
}
.agent-card-top {
  background: var(--red-d);
  border-bottom: 1px solid var(--red-b);
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.agent-card-name {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.agent-card-meta {
  font-size: 11px;
  color: var(--mid);
}
.agent-card-meta b { color: var(--ink); }

.agent-kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--line);
}
.agent-kpi {
  padding: 12px 8px;
  text-align: center;
  border-right: 1px solid var(--line);
}
.agent-kpi:last-child { border-right: none; }
.agent-kpi-val {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
}
.agent-kpi-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--dim);
}

/* ── PEDIDO ITEM ────────────────────────── */
.pedidos-wrap { padding: 12px 14px; }
.pedidos-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 10px;
}

.pedido-item {
  background: var(--bg3);
  border-radius: 8px;
  padding: 11px 13px;
  margin-bottom: 7px;
  border-left: 3px solid var(--dim);
  position: relative;
}
.pedido-item.em-rota { border-left-color: var(--red); }
.pedido-item.entregue { border-left-color: var(--ok); }
.pedido-item.ausente { border-left-color: var(--warn); }

.pedido-row1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  gap: 8px;
}
.pedido-num {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.status-pill {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  flex-shrink: 0;
}
.pill-rota { background: var(--red-d); color: #FF6680; border: 1px solid var(--red-b); }
.pill-ok   { background: var(--ok-d);  color: #4ADE80; border: 1px solid rgba(0,217,126,0.3); }
.pill-warn { background: var(--warn-d);color: #FBBF24; border: 1px solid rgba(245,166,35,0.3); }
.pill-grey { background: var(--bg4);   color: var(--mid); border: 1px solid var(--line); }

.pedido-dest { font-size: 13px; color: var(--ink); margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pedido-cep { font-family: var(--mono); font-size: 11px; color: var(--mid); }
.pedido-alert { font-size: 10px; font-weight: 600; color: var(--warn); margin-top: 4px; }

/* ── REGION LIST (tab Regiões) ───────────── */
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.filt {
  flex: 1 1 140px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--ink);
  padding: 9px 10px;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  outline: none;
  min-width: 0;
  transition: border-color 0.15s;
}
.filt:focus { border-color: var(--red); }

.btn-limpar {
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--mid);
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-limpar:active { border-color: var(--red); }

.region-card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.region-card.has-rota { border-color: rgba(232,0,45,0.3); }

.region-header {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.region-header:active { background: rgba(255,255,255,0.03); }

.region-chevron {
  color: var(--dim);
  font-size: 11px;
  flex-shrink: 0;
  transition: transform 0.2s;
}
.region-chevron.open { transform: rotate(90deg); }

.region-info { flex: 1; min-width: 0; }
.region-name {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.gerente-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--red-d);
  color: #FF6680;
  border: 1px solid var(--red-b);
}

.region-counts {
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  align-items: center;
}
.rc {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 28px;
}
.rc-num {
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 700;
  line-height: 1;
}
.rc-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--dim);
}

.agents-list {
  display: none;
  border-top: 1px solid var(--line);
}
.agents-list.open { display: block; }

.agent-row {
  display: flex;
  align-items: center;
  padding: 9px 14px 9px 36px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  gap: 10px;
}
.agent-row:last-child { border-bottom: none; }
.agent-row-info { flex: 1; min-width: 0; }
.agent-row-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.agent-row-cod { font-family: var(--mono); font-size: 10px; color: var(--mid); }

.agent-row-stats { display: flex; gap: 8px; flex-shrink: 0; }
.ars {
  text-align: center;
  min-width: 26px;
}
.ars-num {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
}
.ars-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); }

/* ── CEP TAB ─────────────────────────────── */
.cep-search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.cep-search-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 10px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 500;
  padding: 11px 14px;
  outline: none;
  letter-spacing: 1px;
  transition: border-color 0.15s;
}
.cep-search-input:focus { border-color: var(--red); }
.cep-search-input::placeholder { color: var(--dim); font-size: 13px; font-family: var(--font); font-weight: 400; letter-spacing: 0; }

.cep-group-card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.cep-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.cep-group-header:active { background: rgba(255,255,255,0.03); }
.cep-prefix {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--ink);
}
.cep-prefix-label { font-size: 11px; color: var(--mid); margin-top: 1px; }
.cep-group-stats {
  display: flex;
  gap: 14px;
  align-items: center;
}
.cep-stat-num {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  text-align: right;
}
.cep-stat-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--dim);
  text-align: right;
}

.cep-pedidos-list {
  display: none;
  padding: 10px 14px;
}
.cep-pedidos-list.open { display: block; }

.cep-pedido-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.cep-pedido-row:last-child { border-bottom: none; }
.cep-status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}
.cep-pedido-info { flex: 1; min-width: 0; }
.cep-pedido-num {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.cep-pedido-dest { font-size: 12px; color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cep-pedido-agent { font-size: 11px; color: var(--dim); margin-top: 1px; }
.cep-pedido-status { font-size: 10px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }

/* ── EMPTY / LOADING ────────────────────── */
.empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--dim);
}
.empty h3 {
  font-family: var(--mono);
  font-size: 15px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 8px;
}

.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--bg4);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── PROGRESS BAR de atualização ─────────── */
.update-bar {
  height: 2px;
  background: var(--red);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.3s;
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 54px);
  left: 0; right: 0;
  z-index: 55;
}
.update-bar.active { transform: scaleX(0.6); transition: transform 3s ease-out; }
.update-bar.done   { transform: scaleX(1);   transition: transform 0.2s; opacity: 0; transition: transform 0.2s, opacity 0.5s 0.2s; }

/* ── NO-DATA message ────────────────────── */
.no-result {
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  color: var(--mid);
  font-size: 13px;
}
</style>

<!-- MARKUP -->
<div class="update-bar" id="update-bar"></div>

<header class="app-header">
  <div class="logo">FLEX<em>BOYS</em></div>
  <div class="header-sep"></div>
  <div class="live-pill">
    <div class="live-dot"></div>
    <div class="live-text">Agentes · <span id="snap-ts">carregando...</span></div>
  </div>
  <button class="header-refresh" onclick="loadData(true)" id="refresh-btn">
    <span class="refresh-icon">⟳</span>
    <span id="refresh-label">Atualizar</span>
  </button>
  <div class="countdown-pill" id="refresh-toggle" onclick="toggleRefresh()" title="Clique para pausar/retomar">
    <span class="countdown-icon">🔄</span>
    <span id="refresh-countdown">15:00</span>
  </div>
</header>


<nav class="tab-nav" id="tab-nav" style="display:none">
  <button class="tab-btn active" onclick="switchTab('busca')">
    <span class="tab-icon">🔍</span> Buscar Agente
  </button>
  <button class="tab-btn" onclick="switchTab('regioes')">
    <span class="tab-icon">📍</span> Regiões
  </button>
  <button class="tab-btn" onclick="switchTab('cep')">
    <span class="tab-icon">📮</span> Por CEP
    <span class="tab-badge" id="cep-badge" style="display:none"></span>
  </button>
</nav>

<!-- TAB: BUSCAR AGENTE -->
<div class="tab-pane active" id="pane-busca">
  <div class="empty" id="loading-view">
    <div class="spinner"></div>
    <div>Conectando ao Google Sheets...</div>
  </div>
  <div id="busca-view" style="display:none">
    <div class="search-bar">
      <input class="search-input" id="search-input" type="number" inputmode="numeric"
        placeholder="Código do agente…"
        oninput="onSearchInput()"
        onkeydown="if(event.key==='Enter') buscarAgente()">
      <button class="btn-buscar" onclick="buscarAgente()">Buscar</button>

    <div id="search-result"></div>

</div>

<!-- TAB: REGIÕES -->
<div class="tab-pane" id="pane-regioes">
  <div class="filter-row">
    <select class="filt" id="filt-gerente" onchange="renderRegioes()">
      <option value="">Todos os Gerentes</option>
    </select>
    <select class="filt" id="filt-status" onchange="renderRegioes()">
      <option value="">Todos os Status</option>
      <option value="EM ROTA">Em Rota</option>
      <option value="ENTREGUE">Entregue</option>

<!-- TAB: POR CEP -->
<div class="tab-pane" id="pane-cep">
  <div class="cep-search-row">
    <input class="cep-search-input" id="cep-filter" type="text" inputmode="numeric"
      placeholder="Filtrar por prefixo de CEP…"
      oninput="renderCep()">
    <select class="filt" id="cep-status-filt" onchange="renderCep()" style="flex:0 0 auto;min-width:130px">
      <option value="">Todos</option>
      <option value="EM ROTA">Em Rota</option>
      <option value="ENTREGUE">Entregue</option>
      <option value="AUSENTE">Ausente</option>
    </select>
  </div>
  <div id="cep-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ════════════════════════════════════════════════
   DADOS / CONFIGURAÇÃO
   ════════════════════════════════════════════════ */
const SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcxVKmt__Dq3kYrCvQHBu8gS18z14sb5PeLyG-dPSprKWMnj0E9xW5kn5Y1Eni06-y0gnMdiJbVoQI/pub?gid=0&single=true&output=csv";

const D_RESP = [
  {r:"BARUERI_1",g:"DANIEL"},{r:"BARUERI_2",g:"DANIEL"},{r:"CARAPICUIBA",g:"DANIEL"},
  {r:"CENTRO",g:"RODRIGO"},{r:"COTIA",g:"DANIEL"},{r:"DIADEMA",g:"BRUNO"},
  {r:"EMBU_1",g:"DANIEL"},{r:"EMBU_2",g:"DANIEL"},{r:"GUARULHOS_1",g:"RODRIGO"},
  {r:"GUARULHOS_2",g:"RODRIGO"},{r:"GUARULHOS_3",g:"RODRIGO"},{r:"GUARULHOS_4",g:"RODRIGO"},
  {r:"LESTE_1",g:"BRUNO"},{r:"LESTE_2",g:"BRUNO"},{r:"LESTE_3",g:"BRUNO"},
  {r:"LESTE_4",g:"BRUNO"},{r:"LESTE_5",g:"BRUNO"},{r:"MAUA",g:"BRUNO"},
  {r:"NORTE_1",g:"RODRIGO"},{r:"NORTE_2",g:"RODRIGO"},{r:"NORTE_3",g:"RODRIGO"},
  {r:"OESTE_1",g:"DANIEL"},{r:"OESTE_2",g:"DANIEL"},{r:"OESTE_3",g:"DANIEL"},
  {r:"OSASCO_1",g:"DANIEL"},{r:"OSASCO_2",g:"DANIEL"},{r:"OSASCO_3",g:"DANIEL"},
  {r:"SANTO_ANDRE_1",g:"BRUNO"},{r:"SANTO_ANDRE_2",g:"BRUNO"},{r:"SANTO_ANDRE_3",g:"BRUNO"},
  {r:"SAO_BERNARDO_1",g:"BRUNO"},{r:"SAO_BERNARDO_2",g:"BRUNO"},{r:"SAO_CAETANO",g:"BRUNO"},
  {r:"SUL_1",g:"DANIEL"},{r:"SUL_2",g:"DANIEL"},{r:"SUL_3",g:"DANIEL"},
  {r:"TABOAO",g:"DANIEL"},{r:"ITAQUAQUECETUBA",g:"BRUNO"},{r:"CAJAMAR",g:"RODRIGO"}
];
const respMap = {};
D_RESP.forEach(d => respMap[d.r] = d.g);

const AGENT_OVERRIDE = { '883':'RODRIGO','1626':'RODRIGO','1035':'RODRIGO' };

/* ════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════ */
let rawData    = [];
let activeTab  = 'busca';
let openRegSet = new Set();
let openCepSet = new Set();
let recentSearches = [];

/* ════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════ */
function parseDt(str) {
  if (!str) return null;
  const m = (str+'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)) : null;
}

function latestDate(data) {
  let d = null;
  data.forEach(r => {
    const t = parseDt(r['Data Historico'] || r['Data Histórico']);
    if (t && (!d || t > d)) d = t;
  });
  return d;
}

function getGerente(row) {
  const ag = (row['Agente'] || '').trim();
  const cm = ag.match(/^(\d+)/);
  if (cm && AGENT_OVERRIDE[cm[1]]) return AGENT_OVERRIDE[cm[1]];
  const reg = (row['Regiao Destino'] || row['Região Destino'] || '').trim().toUpperCase();
  return respMap[reg] || '—';
}

function normServico(row) {
  const s = (row['Servico'] || row['Serviço'] || '').trim().toUpperCase();
  if (s.includes('SHOPEE')) return 'SHOPEE';
  if (s.includes('MERCADO') || s.includes('FLEX')) return 'ML';
  return 'OUTROS';
}

function normStatus(row) {
  const hist  = (row['Historico'] || '').trim().toUpperCase();
  const ecom  = (row['Historico Ecommerce'] || '').trim().toUpperCase();
  const ep    = ecom.split('<QL>')[0].trim();
  const serv  = normServico(row);
  if (serv === 'ML') {
    if (ep.startsWith('A CAMINHO')) return 'EM ROTA';
    if (hist === 'ENTREGUE') return 'ENTREGUE';
    if (hist === 'AUSENTE')  return 'AUSENTE';
    return hist || 'OUTROS';
  }
  if (hist === 'EM ROTA DE ENTREGA') return 'EM ROTA';
  if (hist === 'ENTREGUE')  return 'ENTREGUE';
  if (hist === 'AUSENTE')   return 'AUSENTE';
  return hist || 'OUTROS';
}

function statusColor(s) {
  if (s === 'EM ROTA')  return 'var(--red)';
  if (s === 'ENTREGUE') return 'var(--ok)';
  if (s === 'AUSENTE')  return 'var(--warn)';
  return 'var(--dim)';
}
function statusPillClass(s) {
  if (s === 'EM ROTA')  return 'pill-rota';
  if (s === 'ENTREGUE') return 'pill-ok';
  if (s === 'AUSENTE')  return 'pill-warn';
  return 'pill-grey';
}
function pedidoClass(s) {
  if (s === 'EM ROTA')  return 'em-rota';
  if (s === 'ENTREGUE') return 'entregue';
  if (s === 'AUSENTE')  return 'ausente';
  return '';
}

function getAgentCod(agStr) {
  const m = (agStr||'').match(/^(\d+)/);
  return m ? m[1] : '';
}
function getAgentName(agStr) {
  return (agStr||'').replace(/^\d+\s*[-–]\s*/, '').trim();
}

function getNumeroPedido(row) {
  for (const k of Object.keys(row)) {
    if (k.toLowerCase().includes('pedido')) return row[k] || '—';
  }
  return '—';
}

function fmt(n) { return (n||0).toLocaleString('pt-BR'); }
function pct(n, total) { return total ? Math.round(n/total*100)+'%' : '0%'; }

/* ════════════════════════════════════════════════
   CARGA DE DADOS
   ════════════════════════════════════════════════ */
async function loadData(manual = false) {
  if (manual) startRefreshTimer();
  const bar = document.getElementById('update-bar');
  const btn = document.getElementById('refresh-btn');
  bar.className = 'update-bar active';
  if (btn) { btn.disabled = true; document.getElementById('refresh-label').textContent = 'Aguarde...'; }

  try {
    const resp = await fetch(SHEETS_URL + '&_=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const csv  = await resp.text();
    const wb   = XLSX.read(csv, {type:'string'});
    const ws   = wb.Sheets[wb.SheetNames[0]];
    rawData    = XLSX.utils.sheet_to_json(ws, {defval:''});
    if (!rawData.length) throw new Error('Vazio');

    const ts = latestDate(rawData);
    document.getElementById('snap-ts').textContent = ts
      ? ts.toLocaleDateString('pt-BR') + ' ' + ts.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
      : '—';

    updateKpis();
    populateGerenteFilter();

    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('busca-view').style.display   = 'block';
    document.getElementById('tab-nav').style.display      = 'flex';

    if (activeTab === 'regioes') renderRegioes();
    if (activeTab === 'cep')     renderCep();

    bar.className = 'update-bar done';
    setTimeout(() => { bar.className = 'update-bar'; }, 800);
  } catch(e) {
    document.getElementById('loading-view').innerHTML =
      `<div class="empty"><h3>Falha na conexão</h3><div style="font-size:13px;margin-bottom:16px">${e.message}</div><button class="btn-buscar" onclick="loadData(true)" style="margin:0 auto">Tentar Novamente</button></div>`;
    bar.className = 'update-bar';
  } finally {
    if (btn) { btn.disabled = false; document.getElementById('refresh-label').textContent = 'Atualizar'; }
  }
}

/* ════════════════════════════════════════════════
   KPIs
   ════════════════════════════════════════════════ */
function updateKpis() {
  // badge no tab CEP — conta CEPs únicos em rota
  const cepsEmRota = new Set(rawData.filter(r => normStatus(r)==='EM ROTA').map(r => String(r['Cep']||'').replace(/\D/g,'').slice(0,5)));
  const badge = document.getElementById('cep-badge');
  if (badge && cepsEmRota.size > 0) {
    badge.textContent = cepsEmRota.size;
    badge.style.display = 'inline-block';
  }
}

function populateGerenteFilter() {
  const sel = document.getElementById('filt-gerente');
  const gerentes = [...new Set(D_RESP.map(d => d.g))].sort();
  sel.innerHTML = '<option value="">Todos os Gerentes</option>';
  gerentes.forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
}

/* ════════════════════════════════════════════════
   TABS
   ════════════════════════════════════════════════ */
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  const idx = ['busca','regioes','cep'].indexOf(tab);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  document.getElementById('pane-' + tab).classList.add('active');
  if (tab === 'regioes' && rawData.length) renderRegioes();
  if (tab === 'cep'     && rawData.length) renderCep();
}

/* ════════════════════════════════════════════════
   TAB — BUSCAR AGENTE
   ════════════════════════════════════════════════ */
function onSearchInput() {
  const v = document.getElementById('search-input').value;
  document.getElementById('btn-clear').style.display = v ? 'block' : 'none';
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('btn-clear').style.display = 'none';
  document.getElementById('search-result').innerHTML = '';
}

function buscarAgente() {
  const cod = (document.getElementById('search-input').value||'').trim();
  if (!cod) return;

  const rows = rawData.filter(r => getAgentCod(r['Agente']||'') === cod);
  const container = document.getElementById('search-result');

  if (!rows.length) {
    container.innerHTML = `<div class="no-result">Nenhum agente encontrado com código <b>${cod}</b></div>`;
    return;
  }

  // salva buscas recentes
  if (!recentSearches.includes(cod)) {
    recentSearches.unshift(cod);
    if (recentSearches.length > 5) recentSearches.pop();
    renderRecentSearches();
  }

  const nome    = getAgentName(rows[0]['Agente']||'');
  const gerente = getGerente(rows[0]);
  const reg     = (rows[0]['Regiao Destino']||'').trim().toUpperCase();

  let rota=0, ok=0, aus=0;
  rows.forEach(r => {
    const s = normStatus(r);
    if (s==='EM ROTA') rota++;
    else if (s==='ENTREGUE') ok++;
    else if (s==='AUSENTE') aus++;
  });

  const pedidosHTML = rows
    .sort((a,b) => {
      const o = {'EM ROTA':0,'AUSENTE':1,'ENTREGUE':2};
      return (o[normStatus(a)]??3) - (o[normStatus(b)]??3);
    })
    .map(r => {
      const s   = normStatus(r);
      const sc  = pedidoClass(s);
      const pc  = statusPillClass(s);
      const dest = r['Destinatario'] || r['Destinatário'] || '—';
      const end  = r['Endereco de Entrega'] || r['Endereço de Entrega'] || '';
      const cep  = String(r['Cep']||'—');
      const nped = getNumeroPedido(r);
      return `<div class="pedido-item ${sc}">
        <div class="pedido-row1">
          <div class="pedido-num">${nped}</div>
          <div class="status-pill ${pc}">${s}</div>
        </div>
        <div class="pedido-dest">${dest}</div>
        ${end ? `<div class="pedido-cep" style="color:var(--mid);font-size:11px;margin-top:1px">${end}</div>` : ''}
        <div class="pedido-cep">📮 ${cep}</div>
      </div>`;
    }).join('');

  container.innerHTML = `
    <div class="agent-card">
      <div class="agent-card-top">
        <div>
          <div class="agent-card-name">${nome || 'Agente ' + cod}</div>
          <div class="agent-card-meta">Cód <b>${cod}</b> · ${reg} · <b>${gerente}</b></div>
        </div>
        <div class="status-pill ${rota > 0 ? 'pill-rota' : 'pill-grey'}" style="font-size:10px">${rota > 0 ? rota+' em rota' : 'finalizado'}</div>
      </div>
      <div class="agent-kpi-row">
        <div class="agent-kpi">
          <div class="agent-kpi-val">${rows.length}</div>
          <div class="agent-kpi-label">Total</div>
        </div>
        <div class="agent-kpi">
          <div class="agent-kpi-val" style="color:var(--red)">${rota}</div>
          <div class="agent-kpi-label">Rota</div>
        </div>
        <div class="agent-kpi">
          <div class="agent-kpi-val" style="color:var(--ok)">${ok}</div>
          <div class="agent-kpi-label">Entregue</div>
        </div>
        <div class="agent-kpi">
          <div class="agent-kpi-val" style="color:var(--warn)">${aus}</div>
          <div class="agent-kpi-label">Ausente</div>
        </div>
      </div>
      <div class="pedidos-wrap">
        <div class="pedidos-label">Pedidos (${rows.length})</div>
        ${pedidosHTML}
      </div>
    </div>`;

  container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderRecentSearches() {
  if (!recentSearches.length) return;
  document.getElementById('last-searches').innerHTML = `
    <div style="font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Buscas recentes</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${recentSearches.map(c => `<button onclick="document.getElementById('search-input').value='${c}';buscarAgente()" style="background:var(--bg3);border:1px solid var(--line2);color:var(--mid);padding:6px 14px;border-radius:6px;font-family:var(--mono);font-size:14px;cursor:pointer">${c}</button>`).join('')}
    </div>`;
}

/* ════════════════════════════════════════════════
   TAB — REGIÕES
   ════════════════════════════════════════════════ */
function limparFiltros() {
  document.getElementById('filt-gerente').value = '';
  document.getElementById('filt-status').value  = '';
  renderRegioes();
}

function renderRegioes() {
  const gf = document.getElementById('filt-gerente').value;
  const sf = document.getElementById('filt-status').value;

  const filtered = rawData.filter(r => {
    if (gf && getGerente(r) !== gf) return false;
    if (sf && normStatus(r) !== sf) return false;
    return true;
  });

  // agrupar: região → agente → contagens
  const regioes = {};
  filtered.forEach(row => {
    const reg = (row['Regiao Destino']||'SEM REGIÃO').trim().toUpperCase();
    const ag  = (row['Agente']||'').trim();
    const s   = normStatus(row);
    if (!regioes[reg]) regioes[reg] = {};
    if (!regioes[reg][ag]) regioes[reg][ag] = {rota:0,ok:0,aus:0,outros:0};
    if (s==='EM ROTA') regioes[reg][ag].rota++;
    else if (s==='ENTREGUE') regioes[reg][ag].ok++;
    else if (s==='AUSENTE') regioes[reg][ag].aus++;
    else regioes[reg][ag].outros++;
  });

  const list = document.getElementById('regioes-list');
  if (!Object.keys(regioes).length) {
    list.innerHTML = '<div class="no-result">Nenhum resultado</div>';
    return;
  }

  list.innerHTML = '';

  // ordenar regiões: com em-rota primeiro
  const sortedRegs = Object.keys(regioes).sort((a,b) => {
    const ra = Object.values(regioes[a]).reduce((s,v)=>s+v.rota,0);
    const rb = Object.values(regioes[b]).reduce((s,v)=>s+v.rota,0);
    return rb - ra || a.localeCompare(b);
  });

  sortedRegs.forEach(reg => {
    const gerente = respMap[reg] || '—';
    const agts    = regioes[reg];
    let rR=0, oR=0, aR=0;
    Object.values(agts).forEach(a => { rR+=a.rota; oR+=a.ok; aR+=a.aus; });
    const isOpen  = openRegSet.has(reg);
    const hasRota = rR > 0;

    const card = document.createElement('div');
    card.className = 'region-card' + (hasRota ? ' has-rota' : '');
    card.innerHTML = `
      <div class="region-header" onclick="toggleReg('${reg}')">
        <div class="region-chevron ${isOpen?'open':''}">▶</div>
        <div class="region-info">
          <div class="region-name">${reg.replace(/_/g,' ')}</div>
          <span class="gerente-tag">${gerente}</span>
        </div>
        <div class="region-counts">
          ${rR ? `<div class="rc"><div class="rc-num" style="color:var(--red)">${rR}</div><div class="rc-label">Rota</div></div>` : ''}
          ${oR ? `<div class="rc"><div class="rc-num" style="color:var(--ok)">${oR}</div><div class="rc-label">OK</div></div>` : ''}
          ${aR ? `<div class="rc"><div class="rc-num" style="color:var(--warn)">${aR}</div><div class="rc-label">Aus.</div></div>` : ''}
        </div>
      </div>
      <div class="agents-list ${isOpen?'open':''}" id="reg-${reg}">
        ${Object.keys(agts)
          .sort((a,b) => {
            const ta = agts[a].rota+agts[a].aus;
            const tb = agts[b].rota+agts[b].aus;
            return tb-ta;
          })
          .map(ag => {
            const s = agts[ag];
            const cod  = getAgentCod(ag);
            const nome = getAgentName(ag) || ag;
            return `<div class="agent-row">
              <div class="agent-row-info">
                <div class="agent-row-name">${nome}</div>
                <div class="agent-row-cod">Cód ${cod}</div>
              </div>
              <div class="agent-row-stats">
                <div class="ars"><div class="ars-num" style="color:var(--red)">${s.rota||'–'}</div><div class="ars-label">Rota</div></div>
                <div class="ars"><div class="ars-num" style="color:var(--ok)">${s.ok||'–'}</div><div class="ars-label">OK</div></div>
                <div class="ars"><div class="ars-num" style="color:var(--warn)">${s.aus||'–'}</div><div class="ars-label">Aus</div></div>
              </div>
            </div>`;
          }).join('')}
      </div>`;
    list.appendChild(card);
  });
}

function toggleReg(reg) {
  if (openRegSet.has(reg)) openRegSet.delete(reg);
  else openRegSet.add(reg);
  renderRegioes();
}

/* ════════════════════════════════════════════════
   TAB — POR CEP
   ════════════════════════════════════════════════ */
function renderCep() {
  const prefix   = (document.getElementById('cep-filter').value||'').replace(/\D/g,'');
  const sfilt    = document.getElementById('cep-status-filt').value;

  const filtered = rawData.filter(r => {
    const cep = String(r['Cep']||'').replace(/\D/g,'');
    if (prefix && !cep.startsWith(prefix)) return false;
    if (sfilt  && normStatus(r) !== sfilt)  return false;
    return true;
  });

  // agrupar por prefixo de 5 dígitos (CEP raiz da rua)
  const grupos = {};
  filtered.forEach(r => {
    const cep  = String(r['Cep']||'').replace(/\D/g,'');
    const pref = cep.slice(0,5) || 'SEM CEP';
    if (!grupos[pref]) grupos[pref] = [];
    grupos[pref].push(r);
  });

  const list = document.getElementById('cep-list');
  if (!Object.keys(grupos).length) {
    list.innerHTML = '<div class="no-result">Nenhum pedido encontrado</div>';
    return;
  }

  // ordenar: mais pedidos em rota primeiro, depois por prefixo
  const sorted = Object.keys(grupos).sort((a,b) => {
    const ra = grupos[a].filter(r => normStatus(r)==='EM ROTA').length;
    const rb = grupos[b].filter(r => normStatus(r)==='EM ROTA').length;
    return rb-ra || a.localeCompare(b);
  });

  list.innerHTML = '';
  sorted.forEach(pref => {
    const rows  = grupos[pref];
    const rota  = rows.filter(r => normStatus(r)==='EM ROTA').length;
    const ok    = rows.filter(r => normStatus(r)==='ENTREGUE').length;
    const aus   = rows.filter(r => normStatus(r)==='AUSENTE').length;
    const isOpen = openCepSet.has(pref);

    // bairro/região de referência (pega o mais frequente)
    const bairros = {};
    rows.forEach(r => {
      const b = (r['Bairro']||'').trim();
      if (b) bairros[b] = (bairros[b]||0)+1;
    });
    const bairro = Object.keys(bairros).sort((a,b)=>bairros[b]-bairros[a])[0] || '';

    const card = document.createElement('div');
    card.className = 'cep-group-card';
    card.innerHTML = `
      <div class="cep-group-header" onclick="toggleCep('${pref}')">
        <div>
          <div class="cep-prefix">${pref}-xxx</div>
          ${bairro ? `<div class="cep-prefix-label">${bairro}</div>` : ''}
        </div>
        <div class="cep-group-stats">
          ${rota ? `<div><div class="cep-stat-num" style="color:var(--red)">${rota}</div><div class="cep-stat-label">Rota</div></div>` : ''}
          ${ok   ? `<div><div class="cep-stat-num" style="color:var(--ok)">${ok}</div><div class="cep-stat-label">OK</div></div>` : ''}
          ${aus  ? `<div><div class="cep-stat-num" style="color:var(--warn)">${aus}</div><div class="cep-stat-label">Aus</div></div>` : ''}
          <div><div class="cep-stat-num" style="color:var(--mid)">${rows.length}</div><div class="cep-stat-label">Total</div></div>
        </div>
      </div>
      <div class="cep-pedidos-list ${isOpen?'open':''}" id="cep-${pref}">
        ${rows
          .sort((a,b) => {
            const o = {'EM ROTA':0,'AUSENTE':1,'ENTREGUE':2};
            return (o[normStatus(a)]??3) - (o[normStatus(b)]??3);
          })
          .map(r => {
            const s      = normStatus(r);
            const col    = statusColor(s);
            const dest   = r['Destinatario']||r['Destinatário']||'—';
            const ag     = (r['Agente']||'').trim();
            const agName = getAgentName(ag);
            const agCod  = getAgentCod(ag);
            const nped   = getNumeroPedido(r);
            const remessa = r['Remessa'] || '—';
            const serv   = normServico(r);
            const servCol = serv==='ML' ? 'var(--warn)' : serv==='SHOPEE' ? 'var(--ok)' : 'var(--mid)';
            return `<div class="cep-pedido-row">
              <div class="cep-status-dot" style="background:${col}"></div>
              <div class="cep-pedido-info">
                <div class="cep-pedido-num" style="display:flex;align-items:center;gap:8px">
                  <span>${nped}</span>
                  <span style="font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:${servCol}22;color:${servCol};border:1px solid ${servCol}44">${serv}</span>
                </div>
                <div class="cep-pedido-dest">${dest}</div>
                <div class="cep-pedido-agent" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:3px">
                  <span>👤 <b style="color:var(--ink)">${agName}</b> · <span style="font-family:var(--mono);color:var(--mid)">${agCod}</span></span>
                  <span style="font-family:var(--mono);font-size:10px;color:var(--dim)">🔖 ${remessa}</span>
                </div>
              </div>
              <div class="cep-pedido-status" style="color:${col};font-size:10px;font-weight:700;text-align:right">${s}</div>
            </div>`;
          }).join('')}
      </div>`;
    list.appendChild(card);
  });
}

function toggleCep(pref) {
  if (openCepSet.has(pref)) openCepSet.delete(pref);
  else openCepSet.add(pref);
  renderCep();
}

/* ════════════════════════════════════════════════
   COUNTDOWN DE ATUALIZAÇÃO
   ════════════════════════════════════════════════ */
const AUTO_REFRESH_SECS = 15 * 60;
let refreshEnabled  = true;
let refreshSecsLeft = AUTO_REFRESH_SECS;
let refreshTimerIntvl = null;

function updateRefreshUI() {
  const mins  = Math.floor(refreshSecsLeft / 60);
  const secs  = refreshSecsLeft % 60;
  const label = `${mins}:${String(secs).padStart(2,'0')}`;
  const el    = document.getElementById('refresh-countdown');
  if (el) {
    el.textContent = label;
    if (refreshSecsLeft <= 60)        el.style.color = 'var(--red)';
    else if (refreshSecsLeft <= 120)  el.style.color = 'var(--warn)';
    else                              el.style.color = 'var(--ok)';
  }
  const pill = document.getElementById('refresh-toggle');
  if (pill) pill.classList.toggle('paused', !refreshEnabled);
}

function startRefreshTimer() {
  clearInterval(refreshTimerIntvl);
  refreshSecsLeft = AUTO_REFRESH_SECS;
  updateRefreshUI();
  refreshTimerIntvl = setInterval(() => {
    if (!refreshEnabled) return;
    refreshSecsLeft--;
    if (refreshSecsLeft <= 0) {
      refreshSecsLeft = AUTO_REFRESH_SECS;
      loadData();
    }
    updateRefreshUI();
  }, 1000);
}

function toggleRefresh() {
  refreshEnabled = !refreshEnabled;
  updateRefreshUI();
}

/* ════════════════════════════════════════════════
   INÍCIO
   ════════════════════════════════════════════════ */
loadData().then(() => startRefreshTimer());
</script>
